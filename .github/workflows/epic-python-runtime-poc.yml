name: Epic runtime — CPython Android ARM64 POC

on:
  push:
    branches:
      - 'development/**'
    paths:
      - '.github/workflows/epic-python-runtime-poc.yml'
      - 'epicbridge/poc/site-packages/epic_runtime_smoke.py'
      - 'epicbridge/poc/patch_legendary_android.py'
      - 'epicbridge/poc/requirements-android.txt'
      - 'epicbridge/**'
      - 'app/src/main/java/**/Epic*.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'settings.gradle'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maliwinlator-epic-cpython-package-v3
  cancel-in-progress: true

jobs:
  build-cpython-android:
    name: Package CPython 3.15.2 Android x86_64 and ARM64 runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout MaliWinlator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: maliwinlator

      - name: Checkout pinned CPython source
        uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: v3.15.2
          path: cpython
          fetch-depth: 1

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            git \
            libbz2-dev \
            libffi-dev \
            liblzma-dev \
            libncurses-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            uuid-dev \
            zlib1g-dev

      - name: Set Android API baseline to MaliWinlator minSdk
        run: echo "ANDROID_API_LEVEL=26" >> "$GITHUB_ENV"

      - name: Verify pinned Android build target
        working-directory: cpython
        run: |
          test -f Platforms/Android/README.md
          test -f Platforms/Android/__main__.py
          python3 Platforms/Android configure-host --help
          git rev-parse HEAD

      - name: Build x86_64 Android runtime for instrumentation testing
        working-directory: cpython
        run: |
          set -euo pipefail
          python3 Platforms/Android configure-build
          python3 Platforms/Android make-build
          python3 Platforms/Android configure-host x86_64-linux-android
          python3 Platforms/Android make-host x86_64-linux-android
          python3 Platforms/Android package x86_64-linux-android

      - name: Checkout pinned Legendary 0.21.1 source
        uses: actions/checkout@v4
        with:
          repository: legendary-gl/legendary
          ref: 42f6bdeadde3a9526dc8eb713763476999ac217b
          path: legendary

      - name: Apply and statically validate Android thread backend
        run: |
          set -euo pipefail
          python3 maliwinlator/epicbridge/poc/patch_legendary_android.py legendary
          python3 -m compileall -q legendary/legendary
          ! grep -R -n -E 'from multiprocessing|multiprocessing\.shared_memory' \
            legendary/legendary/downloader/mp legendary/legendary/core.py legendary/legendary/cli.py
          test -f legendary/legendary/downloader/mp/android_shared_buffer.py

      - name: Run Epic library aggregation regression tests
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/maliwinlator/epicbridge/src/main/python" \
            python3 -m unittest discover \
              -s maliwinlator/epicbridge/poc \
              -p 'test_epicbridge_runner.py' -v

      - name: Smoke-test patched Legendary on host Python
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests filelock pycryptodomex==3.23.0
          python3 -m pip install --disable-pip-version-check --no-deps ./legendary
          mkdir -p "$RUNNER_TEMP/epic-host-shim"
          cat > "$RUNNER_TEMP/epic-host-shim/_epiccrypto.py" <<'PY'
          from Cryptodome.Cipher import AES
          def decrypt_aes_gcm(key, nonce, data, tag):
              return AES.new(key, AES.MODE_GCM, nonce=nonce).decrypt_and_verify(data, tag)
          PY
          PYTHONPATH="$RUNNER_TEMP/epic-host-shim:$GITHUB_WORKSPACE/legendary" python3 -m legendary.cli --version
          PYTHONPATH="$RUNNER_TEMP/epic-host-shim:$GITHUB_WORKSPACE/legendary" python3 - <<'PY'
          from queue import Queue
          from threading import Thread
          from legendary.android_crypto import AES
          from legendary.downloader.mp.manager import DLManager
          from legendary.downloader.mp.workers import DLWorker, FileWorker
          from legendary.downloader.mp.android_shared_buffer import AndroidSharedBuffer
          from legendary.models.downloading import TerminateWorkerTask
          # NIST AES-128-GCM known-answer vector (zero key and nonce).
          ciphertext = bytes.fromhex("0388dace60b6a392f328c2b971b2fe78")
          tag = bytes.fromhex("ab6e47d42cec13bdf53a67b21257bddf")
          assert AES.new(bytes(16), AES.MODE_GCM, nonce=bytes(12)).decrypt_and_verify(ciphertext, tag) == bytes(16)
          assert issubclass(DLManager, Thread)
          assert issubclass(DLWorker, Thread)
          assert issubclass(FileWorker, Thread)
          manager = DLManager("/tmp/epic-smoke", "https://cdn.invalid", {})
          assert manager.error is None
          manager.stop()
          assert manager.running is False
          buffer = AndroidSharedBuffer(4096)
          buffer.buf[:8] = b"MALIWINL"
          assert buffer.buf[:8] == b"MALIWINL"
          log_queue, download_queue, download_results = Queue(), Queue(), Queue()
          writer_queue, writer_results = Queue(), Queue()
          download_worker = DLWorker("epic-download-smoke", download_queue, download_results,
                                     buffer, logging_queue=log_queue)
          writer_worker = FileWorker(writer_queue, writer_results, "/tmp/epic-smoke",
                                     buffer, logging_queue=log_queue)
          download_worker.start()
          writer_worker.start()
          download_queue.put(TerminateWorkerTask())
          writer_queue.put(TerminateWorkerTask())
          download_worker.join(timeout=5)
          writer_worker.join(timeout=5)
          assert not download_worker.is_alive(), "download worker did not stop"
          assert not writer_worker.is_alive(), "writer worker did not stop"
          assert isinstance(writer_results.get(timeout=1), TerminateWorkerTask)
          buffer.close()
          buffer.unlink()
          print("LEGENDARY_ANDROID_THREAD_BACKEND_HOST_SMOKE_OK")
          PY

      - name: Stage Legendary into the x86_64 Android test runtime
        working-directory: cpython
        run: |
          set -euo pipefail
          PREFIX="$PWD/cross-build/x86_64-linux-android/prefix"
          SITE_PACKAGES="$PREFIX/lib/python3.15/site-packages"
          mkdir -p "$SITE_PACKAGES" "$RUNNER_TEMP/epic-wheels"
          python3 -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --python-version 3.15 --implementation py --abi none \
            --dest "$RUNNER_TEMP/epic-wheels" \
            -r "$GITHUB_WORKSPACE/maliwinlator/epicbridge/poc/requirements-android.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os
          from zipfile import ZipFile
          wheels = Path(os.environ["RUNNER_TEMP"]) / "epic-wheels"
          target = Path(os.environ["GITHUB_WORKSPACE"]) / "cpython/cross-build/x86_64-linux-android/prefix/lib/python3.15/site-packages"
          for wheel in sorted(wheels.glob("*.whl")):
              with ZipFile(wheel) as archive:
                  archive.extractall(target)
          PY
          python3 -m pip install --disable-pip-version-check --target "$SITE_PACKAGES" --no-deps "$GITHUB_WORKSPACE/legendary"
          test -f "$SITE_PACKAGES/legendary/__init__.py"
          test -f "$SITE_PACKAGES/legendary_gl-0.21.1.dist-info/METADATA"
          rm -f cross-build/x86_64-linux-android/dist/*.tar.gz
          python3 Platforms/Android package x86_64-linux-android

      - name: Build the production Android ARM64 runtime
        working-directory: cpython
        run: |
          set -euo pipefail
          python3 Platforms/Android configure-host aarch64-linux-android
          python3 Platforms/Android make-host aarch64-linux-android

          # Stage only universal pure-Python wheels; never copy host-native wheels
          # into the Android ARM64 runtime.
          PREFIX="$PWD/cross-build/aarch64-linux-android/prefix"
          SITE_PACKAGES="$PREFIX/lib/python3.15/site-packages"
          mkdir -p "$SITE_PACKAGES" "$RUNNER_TEMP/epic-wheels"
          python3 -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --python-version 3.15 --implementation py --abi none \
            --dest "$RUNNER_TEMP/epic-wheels" \
            -r "$GITHUB_WORKSPACE/maliwinlator/epicbridge/poc/requirements-android.txt"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          wheels = Path(os.environ["RUNNER_TEMP"]) / "epic-wheels"
          target = Path(os.environ["GITHUB_WORKSPACE"]) / "cpython/cross-build/aarch64-linux-android/prefix/lib/python3.15/site-packages"
          for wheel in sorted(wheels.glob("*.whl")):
              with ZipFile(wheel) as archive:
                  archive.extractall(target)
          PY
          python3 -m pip install --disable-pip-version-check --target "$SITE_PACKAGES" --no-deps ./../legendary
          test -f "$SITE_PACKAGES/legendary/__init__.py"
          test -d "$SITE_PACKAGES/requests"
          ! find "$SITE_PACKAGES" -type d -name __pycache__ -print -quit | grep .
          python3 Platforms/Android package aarch64-linux-android

      - name: Audit packaged runtime
        working-directory: cpython
        run: |
          set -euo pipefail
          X86_PACKAGE="$(find cross-build/x86_64-linux-android/dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$X86_PACKAGE"
          tar -tzf "$X86_PACKAGE" | grep -E '(^|/)libpython.*\.so'
          tar -tzf "$X86_PACKAGE" | grep -E 'site-packages/legendary_gl-0\.21\.1\.dist-info/METADATA'
          PACKAGE="$(find cross-build/aarch64-linux-android/dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" | grep -E '(^|/)libpython.*\.so'
          tar -tzf "$PACKAGE" | grep -E 'python3\.15'
          ! tar -tzf "$PACKAGE" | grep -E 'lib-dynload/_posixshmem.*\.so'
          ! tar -tzf "$PACKAGE" | grep -E 'lib-dynload/_multiprocessing.*\.so'
          sha256sum "$X86_PACKAGE" "$PACKAGE" | tee runtime-sha256.txt
          {
            echo "CPython tag: v3.15.2"
            echo "CPython commit: $(git rev-parse HEAD)"
            echo "Android target: aarch64-linux-android"
            echo "App ABI: arm64-v8a"
            echo "Android API level: 26"
            echo "NDK from upstream android-env.sh: 27.3.13750724"
            echo "Emulator test: x86_64-linux-android via upstream Platforms/Android ci --fast-ci"
            echo "Android compatibility: Bionic thread backend; no POSIX named shared memory required"
            echo "Test target: separately built x86_64-linux-android"
            echo "Shipped target: separately built aarch64-linux-android"
            cat runtime-sha256.txt
          } > runtime-build-info.txt
          cat runtime-build-info.txt

      - name: Upload CPython Android runtime POC
        uses: actions/upload-artifact@v4
        with:
          name: maliwinlator-cpython-3.15.2-android-arm64-poc
          path: |
            cpython/cross-build/x86_64-linux-android/dist/*.tar.gz
            cpython/cross-build/aarch64-linux-android/dist/*.tar.gz
            cpython/runtime-build-info.txt
          if-no-files-found: error
          retention-days: 14
