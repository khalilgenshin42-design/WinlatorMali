name: Epic runtime — CPython Android ARM64 POC

on:
  push:
    branches:
      - 'development/**'
    paths:
      - '.github/workflows/epic-python-runtime-poc.yml'
      - 'epicbridge/poc/site-packages/epic_runtime_smoke.py'
      - 'epicbridge/poc/patch_legendary_android.py'
      - 'epicbridge/poc/requirements-android.txt'
      - 'epicbridge/**'
      - 'epicruntime/**'
      - 'epicbridge/build.gradle'
      - 'tools/ci/run-epic-android-instrumentation.sh'
      - 'app/src/main/java/**/Epic*.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'settings.gradle'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maliwinlator-epic-cpython-package-v3
  cancel-in-progress: true

jobs:
  build-cpython-android:
    name: Package CPython 3.15.2 Android x86_64 and ARM64 runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout MaliWinlator source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: maliwinlator
          submodules: recursive
          fetch-depth: 1

      - name: Checkout pinned CPython source
        uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: v3.15.2
          path: cpython
          fetch-depth: 1

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl git libbz2-dev libffi-dev liblzma-dev \
            libncurses-dev libreadline-dev libsqlite3-dev libssl-dev uuid-dev zlib1g-dev

      - name: Set Android API baseline to MaliWinlator minSdk
        run: echo "ANDROID_API_LEVEL=26" >> "$GITHUB_ENV"

      - name: Verify pinned Android build target
        working-directory: cpython
        run: |
          test -f Platforms/Android/README.md
          test -f Platforms/Android/__main__.py
          python3 Platforms/Android configure-host --help
          git rev-parse HEAD

      - name: Build x86_64 Android runtime for instrumentation testing
        working-directory: cpython
        run: |
          set -euo pipefail
          python3 Platforms/Android configure-build
          python3 Platforms/Android make-build
          python3 Platforms/Android configure-host x86_64-linux-android
          python3 Platforms/Android make-host x86_64-linux-android
          python3 Platforms/Android package x86_64-linux-android

      - name: Checkout pinned Legendary 0.21.1 source
        uses: actions/checkout@v4
        with:
          repository: legendary-gl/legendary
          ref: 42f6bdeadde3a9526dc8eb713763476999ac217b
          path: legendary

      - name: Apply and statically validate Android thread backend
        run: |
          set -euo pipefail
          python3 maliwinlator/epicbridge/poc/patch_legendary_android.py legendary
          python3 -m compileall -q legendary/legendary
          ! grep -R -n -E 'from multiprocessing|multiprocessing\.shared_memory' legendary/legendary/downloader/mp legendary/legendary/core.py legendary/legendary/cli.py
          ! grep -R -n --include='*.py' 'Cryptodome' legendary/legendary
          test -f legendary/legendary/downloader/mp/android_shared_buffer.py

      - name: Run Epic library aggregation regression tests
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/maliwinlator/epicbridge/src/main/python" python3 -m unittest discover -s maliwinlator/epicbridge/poc -p 'test_epicbridge_runner.py' -v

      - name: Smoke-test patched Legendary on host Python
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests filelock pycryptodomex==3.23.0
          python3 -m pip install --disable-pip-version-check --no-deps ./legendary
          mkdir -p "$RUNNER_TEMP/epic-host-shim"
          cat > "$RUNNER_TEMP/epic-host-shim/_epiccrypto.py" <<'PY'
          from Cryptodome.Cipher import AES
          def decrypt_aes_gcm(key, nonce, data, tag):
              return AES.new(key, AES.MODE_GCM, nonce=nonce).decrypt_and_verify(data, tag)
          PY
          PYTHONPATH="$RUNNER_TEMP/epic-host-shim:$GITHUB_WORKSPACE/legendary" python3 -m legendary.cli --version
          PYTHONPATH="$RUNNER_TEMP/epic-host-shim:$GITHUB_WORKSPACE/legendary" python3 - <<'PY'
          from queue import Queue
          from threading import Thread
          from legendary.android_crypto import AES
          from legendary.downloader.mp.manager import DLManager
          from legendary.downloader.mp.workers import DLWorker, FileWorker
          from legendary.downloader.mp.android_shared_buffer import AndroidSharedBuffer
          from legendary.models.downloading import TerminateWorkerTask
          ciphertext = bytes.fromhex("0388dace60b6a392f328c2b971b2fe78")
          tag = bytes.fromhex("ab6e47d42cec13bdf53a67b21257bddf")
          assert AES.new(bytes(16), AES.MODE_GCM, nonce=bytes(12)).decrypt_and_verify(ciphertext, tag) == bytes(16)
          assert issubclass(DLManager, Thread) and issubclass(DLWorker, Thread) and issubclass(FileWorker, Thread)
          manager = DLManager("/tmp/epic-smoke", "https://cdn.invalid", {})
          assert manager.error is None
          manager.stop()
          assert manager.running is False
          buffer = AndroidSharedBuffer(4096)
          buffer.buf[:8] = b"MALIWINL"
          assert buffer.buf[:8] == b"MALIWINL"
          log_queue, download_queue, download_results = Queue(), Queue(), Queue()
          writer_queue, writer_results = Queue(), Queue()
          download_worker = DLWorker("epic-download-smoke", download_queue, download_results, buffer, logging_queue=log_queue)
          writer_worker = FileWorker(writer_queue, writer_results, "/tmp/epic-smoke", buffer, logging_queue=log_queue)
          download_worker.start(); writer_worker.start()
          download_queue.put(TerminateWorkerTask()); writer_queue.put(TerminateWorkerTask())
          download_worker.join(timeout=5); writer_worker.join(timeout=5)
          assert not download_worker.is_alive() and not writer_worker.is_alive()
          assert isinstance(writer_results.get(timeout=1), TerminateWorkerTask)
          buffer.close(); buffer.unlink()
          print("LEGENDARY_ANDROID_THREAD_BACKEND_HOST_SMOKE_OK")
          PY

      - name: Stage Legendary into the x86_64 Android test runtime
        working-directory: cpython
        run: |
          set -euo pipefail
          PREFIX="$PWD/cross-build/x86_64-linux-android/prefix"
          SITE_PACKAGES="$PREFIX/lib/python3.15/site-packages"
          mkdir -p "$SITE_PACKAGES" "$RUNNER_TEMP/epic-wheels"
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --python-version 3.15 --implementation py --abi none --dest "$RUNNER_TEMP/epic-wheels" -r "$GITHUB_WORKSPACE/maliwinlator/epicbridge/poc/requirements-android.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os
          from zipfile import ZipFile
          wheels = Path(os.environ["RUNNER_TEMP"]) / "epic-wheels"
          target = Path(os.environ["GITHUB_WORKSPACE"]) / "cpython/cross-build/x86_64-linux-android/prefix/lib/python3.15/site-packages"
          for wheel in sorted(wheels.glob("*.whl")):
              with ZipFile(wheel) as archive: archive.extractall(target)
          PY
          python3 -m pip install --disable-pip-version-check --no-compile --target "$SITE_PACKAGES" --no-deps "$GITHUB_WORKSPACE/legendary"
          test -f "$SITE_PACKAGES/legendary/__init__.py"
          test -f "$SITE_PACKAGES/legendary_gl-0.21.1.dist-info/METADATA"
          # CPython 3.15's zipfile._path is a package directory; explicitly
          # stage it because the Android runtime package currently omits it.
          # Stage the complete CPython 3.15 zipfile package, not just its
          # private _path helper: the Android app must see a package parent
          # and the submodule in the same stdlib tree.
          rm -rf "$PREFIX/lib/python3.15/zipfile"
          cp -aL "$GITHUB_WORKSPACE/cpython/Lib/zipfile" "$PREFIX/lib/python3.15/zipfile"
          test -f "$PREFIX/lib/python3.15/zipfile/__init__.py"
          test -f "$PREFIX/lib/python3.15/zipfile/_path/__init__.py"
          test ! -L "$PREFIX/lib/python3.15/zipfile/_path/__init__.py"
          test ! -L "$PREFIX/lib/python3.15/zipfile/_path"
          rm -f cross-build/x86_64-linux-android/dist/*.tar.gz
          python3 Platforms/Android package x86_64-linux-android

      - name: Run Epic Android runtime prerequisite smoke on managed x86_64 emulator
        working-directory: cpython
        run: |
          set -euo pipefail
          SITE_PACKAGES="$PWD/cross-build/x86_64-linux-android/prefix/lib/python3.15/site-packages"
          cp "$GITHUB_WORKSPACE/maliwinlator/epicbridge/poc/site-packages/epic_runtime_smoke.py" "$SITE_PACKAGES/"
          python3 Platforms/Android test --managed maxVersion --site-packages "$SITE_PACKAGES" -- -m epic_runtime_smoke

      - name: Build the production Android ARM64 runtime
        working-directory: cpython
        run: |
          set -euo pipefail
          python3 Platforms/Android configure-host aarch64-linux-android
          python3 Platforms/Android make-host aarch64-linux-android
          PREFIX="$PWD/cross-build/aarch64-linux-android/prefix"
          SITE_PACKAGES="$PREFIX/lib/python3.15/site-packages"
          mkdir -p "$SITE_PACKAGES" "$RUNNER_TEMP/epic-wheels"
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --python-version 3.15 --implementation py --abi none --dest "$RUNNER_TEMP/epic-wheels" -r "$GITHUB_WORKSPACE/maliwinlator/epicbridge/poc/requirements-android.txt"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          wheels = Path(os.environ["RUNNER_TEMP"]) / "epic-wheels"
          target = Path(os.environ["GITHUB_WORKSPACE"]) / "cpython/cross-build/aarch64-linux-android/prefix/lib/python3.15/site-packages"
          for wheel in sorted(wheels.glob("*.whl")):
              with ZipFile(wheel) as archive: archive.extractall(target)
          PY
          python3 -m pip install --disable-pip-version-check --no-compile --target "$SITE_PACKAGES" --no-deps ./../legendary
          test -f "$SITE_PACKAGES/legendary/__init__.py"
          test -d "$SITE_PACKAGES/requests"
          # Keep the 3.15 zipfile package submodule visible to importlib.resources.
          rm -rf "$PREFIX/lib/python3.15/zipfile"
          cp -aL "$GITHUB_WORKSPACE/cpython/Lib/zipfile" "$PREFIX/lib/python3.15/zipfile"
          test -f "$PREFIX/lib/python3.15/zipfile/__init__.py"
          test -f "$PREFIX/lib/python3.15/zipfile/_path/__init__.py"
          test ! -L "$PREFIX/lib/python3.15/zipfile/_path/__init__.py"
          test ! -L "$PREFIX/lib/python3.15/zipfile/_path"
          ! find "$SITE_PACKAGES" -type d -name __pycache__ -print -quit | grep .
          python3 Platforms/Android package aarch64-linux-android

      - name: Audit packaged runtime
        working-directory: cpython
        run: |
          set -euo pipefail
          X86_PACKAGE="$(find cross-build/x86_64-linux-android/dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$X86_PACKAGE"
          tar -tzf "$X86_PACKAGE" | grep -E '(^|/)libpython.*\.so'
          tar -tzf "$X86_PACKAGE" | grep -E 'site-packages/legendary_gl-0\.21\.1.dist-info/METADATA'
          tar -tzf "$X86_PACKAGE" | grep -E 'lib/python3\.15/zipfile/__init__\.py'
          tar -tzf "$X86_PACKAGE" | grep -E 'lib/python3\.15/zipfile/_path/__init__\.py'
          PACKAGE="$(find cross-build/aarch64-linux-android/dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" | grep -E '(^|/)libpython.*\.so'
          tar -tzf "$PACKAGE" | grep -E 'python3\.15'
          tar -tzf "$PACKAGE" | grep -E 'lib/python3\.15/zipfile/__init__\.py'
          tar -tzf "$PACKAGE" | grep -E 'lib/python3\.15/zipfile/_path/__init__\.py'
          ! tar -tzf "$PACKAGE" | grep -E 'lib-dynload/_posixshmem.*\.so'
          ! tar -tzf "$PACKAGE" | grep -E 'lib-dynload/_multiprocessing.*\.so'
          sha256sum "$X86_PACKAGE" "$PACKAGE" | tee runtime-sha256.txt
          {
            echo "CPython tag: v3.15.2"
            echo "CPython commit: $(git rev-parse HEAD)"
            echo "Android target: aarch64-linux-android"
            echo "App ABI: arm64-v8a"
            echo "Android API level: 26"
            echo "NDK from upstream android-env.sh: 27.3.13750724"
            echo "Emulator test: managed x86_64 via Platforms/Android test --managed maxVersion"
            echo "Android compatibility: Bionic thread backend; no POSIX named shared memory required"
            echo "Test target: separately built x86_64-linux-android"
            echo "Shipped target: separately built aarch64-linux-android"
            cat runtime-sha256.txt
          } > runtime-build-info.txt
          cat runtime-build-info.txt

      - name: Install MaliWinlator Android build toolchain
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Run Epic Bridge x86_64 Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash maliwinlator/tools/ci/run-epic-android-instrumentation.sh

      - name: Build ARM64 Epic runtime library, companion fallback and MaliWinlator host APK
        working-directory: maliwinlator
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :epicruntime:assembleDebug :app:assembleStandardDebug -PepicRuntimeAbi=arm64-v8a -PepicRuntimePrefix="$GITHUB_WORKSPACE/cpython/cross-build/aarch64-linux-android/prefix"
          RUNTIME_AAR="$PWD/epicruntime/build/outputs/aar/epicruntime-debug.aar"
          test -s "$RUNTIME_AAR"
          unzip -l "$RUNTIME_AAR" | grep -F 'assets/python/lib/python3.15/os.py'
          unzip -l "$RUNTIME_AAR" | grep -F 'jni/arm64-v8a/libepic_python.so'
          unzip -l "$RUNTIME_AAR" | grep -F 'EpicRuntimeService'
          BRIDGE_APK="$PWD/epicbridge/build/outputs/apk/debug/epicbridge-debug.apk"
          HOST_APK="$PWD/app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          test -s "$BRIDGE_APK" && test -s "$HOST_APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$BRIDGE_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$HOST_APK"
          "$BUILD_TOOLS/aapt" dump badging "$BRIDGE_APK" | grep -F "package: name='com.maliwinlator.epicbridge'"
          "$BUILD_TOOLS/aapt" dump badging "$HOST_APK" | grep -F "package: name='com.maliwinlator.app'"
          BRIDGE_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$BRIDGE_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')
          HOST_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$HOST_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')
          test -n "$BRIDGE_CERT" && test "$BRIDGE_CERT" = "$HOST_CERT"
          unzip -Z1 "$BRIDGE_APK" | grep -Fx 'lib/arm64-v8a/libepic_python.so'
          unzip -Z1 "$BRIDGE_APK" | grep -Fx 'lib/arm64-v8a/libpython3.15.so'
          ! unzip -Z1 "$BRIDGE_APK" | grep -E '^lib/(x86|x86_64|armeabi-v7a)/'
          NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865"
          READELF="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SYSROOT_LIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/35"
          APK_EXTRACT_ROOT="$RUNNER_TEMP/epic-apk-extracted"
          unzip -qq "$BRIDGE_APK" -d "$APK_EXTRACT_ROOT"
          NATIVE_LIB_DIR="$APK_EXTRACT_ROOT/lib/arm64-v8a"
          PYTHON_LIB_DIR="$APK_EXTRACT_ROOT/assets/python/lib/python3.15"
          test -n "$(find "$NATIVE_LIB_DIR" -type f \( -name '*.so' -o -name '*.so.*' \) -print -quit)"
          test -n "$(find "$PYTHON_LIB_DIR/lib-dynload" -type f \( -name '*.so' -o -name '*.so.*' \) -print -quit)"
          while IFS= read -r -d '' ELF; do
            while IFS= read -r NEEDED; do
              if [ ! -f "$NATIVE_LIB_DIR/$NEEDED" ] && [ ! -f "$SYSROOT_LIB/$NEEDED" ]; then echo "Unresolved Android ELF dependency: $NEEDED required by $ELF"; exit 1; fi
            done < <("$READELF" -d "$ELF" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
          done < <(find "$NATIVE_LIB_DIR" "$PYTHON_LIB_DIR" -type f \( -name '*.so' -o -name '*.so.*' \) -print0)
          unzip -Z1 "$BRIDGE_APK" | grep -Fx 'assets/python/runtime-version.txt'
          unzip -Z1 "$BRIDGE_APK" | grep -Fx 'assets/python/lib/python3.15/os.py'
          unzip -Z1 "$BRIDGE_APK" | grep -Fx 'assets/python/lib/python3.15/site-packages/legendary/__init__.py'
          unzip -Z1 "$BRIDGE_APK" | grep -Fx 'assets/python/lib/python3.15/site-packages/epicbridge_runner.py'
          unzip -Z1 "$HOST_APK" | grep -Fx 'assets/epicbridge.apk'
          mkdir -p "$GITHUB_WORKSPACE/epic-apk-output"
          unzip -p "$HOST_APK" assets/epicbridge.apk > "$RUNNER_TEMP/embedded-epicbridge.apk"
          cmp "$BRIDGE_APK" "$RUNNER_TEMP/embedded-epicbridge.apk"
          cp "$BRIDGE_APK" "$GITHUB_WORKSPACE/epic-apk-output/"
          cp "$HOST_APK" "$GITHUB_WORKSPACE/epic-apk-output/"
          (cd "$GITHUB_WORKSPACE/epic-apk-output" && sha256sum ./*.apk | sed 's#  ./#  #' > SHA256SUMS)

      - name: Upload installable MaliWinlator Epic APKs
        id: epic_apks
        uses: actions/upload-artifact@v4
        with:
          name: maliwinlator-1.2.1-epic-arm64-debug
          path: epic-apk-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload CPython Android runtime POC
        uses: actions/upload-artifact@v4
        with:
          name: maliwinlator-cpython-3.15.2-android-arm64-poc
          path: |
            cpython/cross-build/x86_64-linux-android/dist/*.tar.gz
            cpython/cross-build/aarch64-linux-android/dist/*.tar.gz
            cpython/runtime-build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable Epic APK GitHub prerelease
        id: epic_release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="maliwinlator-1.2.1-epic-${GITHUB_SHA:0:12}"
          TITLE="MaliWinlator 1.2.1 Epic test build (${GITHUB_SHA:0:12})"
          APK_FILES=("$GITHUB_WORKSPACE/epic-apk-output/"*.apk)
          test "${#APK_FILES[@]}" -eq 2
          NOTES_FILE="$RUNNER_TEMP/epic-release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          Experimental ARM64 debug build of the independent Winlator Mali 1.2.1 fork with Legendary-powered Epic account, library, install, update, uninstall, and launch integration.

          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Verification completed before publication:
          - CPython 3.15.2 Android x86_64 managed-emulator runtime smoke
          - Android JNI instrumentation (LegendaryCore, AES-GCM positive/negative, worker-thread, mmap and downloader lifecycle)
          - ARM64 APK build and embedded companion byte comparison
          - Package/signature/ABI/assets/ELF dependency-closure audits

          These are debug-signed test APKs, not production release builds. A different debug certificate may require uninstalling a previous debug package before installation.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APK_FILES[@]}" "$GITHUB_WORKSPACE/epic-apk-output/SHA256SUMS" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${APK_FILES[@]}" "$GITHUB_WORKSPACE/epic-apk-output/SHA256SUMS" --prerelease --title "$TITLE" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA"
          fi
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish successful Epic build status to repository
        if: success()
        continue-on-error: true
        working-directory: maliwinlator
        env:
          EPIC_APK_ARTIFACT_URL: ${{ steps.epic_apks.outputs.artifact-url }}
          EPIC_RELEASE_URL: ${{ steps.epic_release.outputs.url }}
        run: |
          set -euo pipefail
          if ! git fetch origin "$GITHUB_REF_NAME"; then echo "Unable to fetch branch for CI status publication; APK build itself passed."; exit 0; fi
          if ! git reset --hard FETCH_HEAD; then echo "Unable to synchronize branch for CI status publication; APK build itself passed."; exit 0; fi
          cat > PROJECT_EPIC_CI_STATUS.md <<EOF
          # Epic APK CI status
          - Result: **SUCCESS**
          - Run attempt: $GITHUB_RUN_ATTEMPT
          - Source commit: $GITHUB_SHA
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - GitHub prerelease: $EPIC_RELEASE_URL
          - Actions artifact: $EPIC_APK_ARTIFACT_URL
          - Artifact name: maliwinlator-1.2.1-epic-arm64-debug
          - Built host package: com.maliwinlator.app (versionCode 24)
          - Built companion package: com.maliwinlator.epicbridge (versionCode 2)
          - Verification: managed x86_64 runtime tests, Android JNI instrumentation, ARM64 Gradle assembly, APK signatures/package IDs/ABI/assets/ELF dependency closure/embedded companion audits.
          EOF
          { echo; echo "## APK SHA-256"; awk '{print "- " $1 "  " $2}' "$GITHUB_WORKSPACE/epic-apk-output/SHA256SUMS"; } >> PROJECT_EPIC_CI_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_EPIC_CI_STATUS.md
          if ! git commit -m "ci: publish verified Epic APK artifact [skip ci]"; then echo "Unable to commit CI status report; APK build itself passed."; exit 0; fi
          git push origin "HEAD:$GITHUB_REF_NAME" || echo "CI status commit could not be pushed; inspect this workflow run directly."

      - name: Publish failed Epic build status to repository
        if: failure()
        working-directory: maliwinlator
        run: |
          set -euo pipefail
          if ! git fetch origin "$GITHUB_REF_NAME"; then echo "Unable to fetch branch for CI failure report."; exit 0; fi
          if ! git reset --hard FETCH_HEAD; then echo "Unable to synchronize branch for CI failure report."; exit 0; fi
          cat > PROJECT_EPIC_CI_STATUS.md <<EOF
          # Epic APK CI status
          - Result: **FAILURE**
          - Run attempt: $GITHUB_RUN_ATTEMPT
          - Source commit: $GITHUB_SHA
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - APK artifact: not verified; do not install.
          - Failure details: inspect the failed steps in the workflow run above.
          EOF
          git config user.name "github-actions[bot]"
