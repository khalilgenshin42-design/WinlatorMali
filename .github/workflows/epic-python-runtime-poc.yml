name: Epic runtime — CPython Android ARM64 POC

on:
  push:
    branches:
      - 'development/**'
    paths:
      - '.github/workflows/epic-python-runtime-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maliwinlator-epic-cpython-poc
  cancel-in-progress: false

jobs:
  build-cpython-android:
    name: Test CPython 3.15.2 on Android emulator; package ARM64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout MaliWinlator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: maliwinlator

      - name: Checkout pinned CPython source
        uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: v3.15.2
          path: cpython
          fetch-depth: 1

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            git \
            libbz2-dev \
            libffi-dev \
            liblzma-dev \
            libncurses-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            uuid-dev \
            zlib1g-dev

      - name: Set Android API baseline to MaliWinlator minSdk
        run: echo "ANDROID_API_LEVEL=26" >> "$GITHUB_ENV"

      - name: Verify pinned Android build target
        working-directory: cpython
        run: |
          test -f Platforms/Android/README.md
          test -f Platforms/Android/__main__.py
          python3 Platforms/Android configure-host --help
          git rev-parse HEAD

      - name: Build, package, and test with upstream CPython Android CI
        working-directory: cpython
        run: |
          set -euo pipefail
          # The managed emulator on the x86_64 GitHub runner requires an
          # x86_64 app APK. Test a matching x86_64 CPython package first.
          # This is a host-emulator validation, not the ARM64 target artifact.
          python3 Platforms/Android ci x86_64-linux-android --fast-ci

      - name: Smoke-test POSIX shared memory and multiprocessing on Android
        working-directory: cpython
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/epic-site"
          cat > "$RUNNER_TEMP/epic-site/epic_mp_smoke.py" <<'PY'
          from multiprocessing.shared_memory import SharedMemory

          def read_shared_memory(name, result_queue):
              shm = SharedMemory(name=name)
              result_queue.put(bytes(shm.buf[:8]))
              shm.close()
          PY
          python3 Platforms/Android test --managed maxVersion --site-packages "$RUNNER_TEMP/epic-site" -- -c '
          import multiprocessing
          from multiprocessing.shared_memory import SharedMemory
          from epic_mp_smoke import read_shared_memory
          shm = SharedMemory(create=True, size=4096)
          shm.buf[:8] = b"MALIWINL"
          if __name__ == "__main__":
              queue = multiprocessing.Queue()
              process = multiprocessing.Process(target=read_shared_memory, args=(shm.name, queue))
              process.start()
              assert queue.get(timeout=30) == b"MALIWINL"
              process.join(30)
              assert process.exitcode == 0, process.exitcode
              shm.close()
              shm.unlink()
              print("ANDROID_POSIXSHMEM_MULTIPROCESS_OK")
          '

      - name: Build the production Android ARM64 runtime
        working-directory: cpython
        run: |
          set -euo pipefail
          python3 Platforms/Android configure-host aarch64-linux-android
          python3 Platforms/Android make-host aarch64-linux-android
          python3 Platforms/Android package aarch64-linux-android

      - name: Audit packaged runtime
        working-directory: cpython
        run: |
          set -euo pipefail
          PACKAGE="$(find cross-build/aarch64-linux-android/dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" | grep -E '(^|/)libpython.*\.so'
          tar -tzf "$PACKAGE" | grep -E 'python3\.15'
          tar -tzf "$PACKAGE" | grep -E 'lib-dynload/_posixshmem.*\.so'
          sha256sum "$PACKAGE" | tee runtime-sha256.txt
          {
            echo "CPython tag: v3.15.2"
            echo "CPython commit: $(git rev-parse HEAD)"
            echo "Android target: aarch64-linux-android"
            echo "App ABI: arm64-v8a"
            echo "Android API level: 26"
            echo "NDK from upstream android-env.sh: 27.3.13750724"
            echo "Emulator test: x86_64-linux-android via upstream Platforms/Android ci --fast-ci"
            echo "Shared memory test: POSIX shared memory plus multiprocessing child attach"
            echo "Shipped target: separately built aarch64-linux-android"
            cat runtime-sha256.txt
          } > runtime-build-info.txt
          cat runtime-build-info.txt

      - name: Upload CPython Android runtime POC
        uses: actions/upload-artifact@v4
        with:
          name: maliwinlator-cpython-3.15.2-android-arm64-poc
          path: |
            cpython/cross-build/aarch64-linux-android/dist/*.tar.gz
            cpython/runtime-build-info.txt
          if-no-files-found: error
          retention-days: 14
