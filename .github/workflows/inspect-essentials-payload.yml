name: Inspect Essentials payload

on:
  push:
    branches:
      - development/maliwinlator-1.2.1-bootstrap
    paths:
      - .github/workflows/inspect-essentials-payload.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download upstream guest payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload extracted report
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/GunaCharanTeja/Winlator-Extras/releases/download/Sd/container_pattern_common.tzst \
            -o payload/container_pattern_common.tzst
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/GunaCharanTeja/Winlator-Extras/releases/download/Sd/imagefs.tzst \
            -o payload/imagefs.tzst
          sha256sum payload/* | tee report/payload-sha256.txt
          du -h payload/* | tee report/payload-sizes.txt

      - name: Inventory archive contents
        shell: bash
        run: |
          set -euo pipefail
          for archive in payload/*.tzst; do
            name="$(basename "$archive" .tzst)"
            tar --zstd -tf "$archive" > "report/$name-files.txt"
            grep -Ei 'essential|install.*(bat|cmd|sh)|\\.(bat|cmd|ps1|sh)$|wget|vcredist|directx|physx|gecko|mono' \
              "report/$name-files.txt" > "report/$name-candidates.txt" || true
          done

      - name: Extract likely installer scripts and metadata
        shell: bash
        run: |
          set -euo pipefail
          for archive in payload/*.tzst; do
            tar --zstd -xf "$archive" -C extracted
          done
          find extracted -type f \( -iname '*.bat' -o -iname '*.cmd' -o -iname '*.ps1' -o -iname '*.sh' -o -iname '*.reg' \) \
            -print > report/script-files.txt
          while IFS= read -r file; do
            case "$file" in
              *[Ee]ssential*|*[Ii]nstall*|*[Vv]credist*|*[Dd]irect[Xx]*|*[Pp]hys[Xx]*|*[Ww]get*)
                mkdir -p "report/scripts/$(dirname "$file")"
                cp "$file" "report/scripts/$file"
                ;;
            esac
          done < report/script-files.txt
          grep -RInE 'wget|--show-progress|vcredist|DirectX|PhysX|OpenAL|wine-mono|wine-gecko|LAVFilters' extracted \
            --include='*.bat' --include='*.cmd' --include='*.sh' --include='*.ps1' \
            > report/installer-command-matches.txt || true

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: essentials-payload-inspection
          path: report/
          if-no-files-found: error
          retention-days: 7
