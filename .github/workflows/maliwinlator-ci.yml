name: MaliWinlator 1.2.1 baseline APK

on:
  push:
    branches:
      - 'development/**'
    paths:
      - 'app/**'
      - 'epicbridge/**'
      - 'android_sysvshm/**'
      - 'audio_plugin/**'
      - 'input_controls/**'
      - '.github/workflows/maliwinlator-ci.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maliwinlator-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard-debug:
    name: Build MaliWinlator 1.2.1 standard debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact 1.2.1 release ancestry
        run: |
          BASELINE="dfcdd4aaeff6def126ad8173619790806a5830db"
          git merge-base --is-ancestor "$BASELINE" HEAD
          git show -s --format='%H %s' "$BASELINE"
          git show -s --format='%H %s' HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android toolchain
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Verify submodules and wrapper
        run: |
          git submodule status --recursive
          chmod +x ./gradlew
          ./gradlew --version

      - name: Validate Essentials installer safeguards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script = Path("app/src/main/assets/essentials_install.bat").read_text(encoding="utf-8")
          installer = Path("app/src/main/java/com/winlator/cmod/xenvironment/ImageFsInstaller.java").read_text(encoding="utf-8")
          assert script.count("call :download ") == 13, "Expected all 13 Essentials payloads"
          assert script.count("if errorlevel 1 goto download_failed") == 13, "Every download must be checked"
          assert script.count("call :check_installer") == 11, "Every executable/MSI installer must be checked"
          assert script.count("if errorlevel 1 goto install_failed") == 13, "Installer and registry/extraction steps must fail closed"
          assert 'LATEST_VERSION = 22' in installer, "ImageFS version must trigger the installer patch"
          assert 'installEssentialsInstaller(activity, rootDir)' in installer, "Installer patch must be applied after extraction"
          assert 'installer-scripts-readable' not in script
          print("Essentials static safeguards passed: 13 verified downloads, 11 checked installers, fail-closed completion.")
          PY

      - name: Run command parser JVM regression tests
        run: ./gradlew :app:testStandardDebugUnitTest --no-daemon --stacktrace

      - name: Build standard debug APK
        run: ./gradlew :app:assembleStandardDebug :epicbridge:assembleDebug --no-daemon --stacktrace


      - name: Verify embedded Epic Bridge APK and shared signer
        shell: bash
        run: |
          set -euo pipefail
          HOST_APK="$(find app/build/outputs/apk/standard/debug -maxdepth 1 -name '*.apk' -print -quit)"
          BRIDGE_APK="$(find epicbridge/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$HOST_APK"
          test -n "$BRIDGE_APK"
          EMBEDDED_APK="$RUNNER_TEMP/epicbridge-embedded.apk"
          unzip -p "$HOST_APK" assets/epicbridge.apk > "$EMBEDDED_APK"
          unzip -t "$EMBEDDED_APK"
          cmp "$BRIDGE_APK" "$EMBEDDED_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$BRIDGE_APK" | grep -F "package: name='com.maliwinlator.epicbridge'"
          HOST_CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$HOST_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          BRIDGE_CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$BRIDGE_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$HOST_CERT"
          test "$HOST_CERT" = "$BRIDGE_CERT"
          echo "Embedded Epic Bridge APK verified; host and companion signer SHA-256: $HOST_CERT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maliwinlator-1.2.1-standard-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            epicbridge/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
