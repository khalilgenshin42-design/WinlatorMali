plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.maliwinlator.epicbridge.hosttest'
    compileSdk 34

    defaultConfig {
        // Mirrors the production host package so the provider checks the
        // exact package identity used by the real application.
        applicationId 'com.maliwinlator.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
