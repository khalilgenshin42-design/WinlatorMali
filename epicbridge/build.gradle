import java.security.MessageDigest

plugins {
    alias(libs.plugins.android.application)
}

def epicRuntimePrefix = project.findProperty('epicRuntimePrefix') ?: System.getenv('EPIC_RUNTIME_PREFIX')
def epicRuntimeAbi = project.findProperty('epicRuntimeAbi') ?: 'arm64-v8a'
def epicRuntimeGenerated = layout.buildDirectory.dir('generated/epicRuntime')

android {
    namespace 'com.maliwinlator.epicbridge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.maliwinlator.epicbridge'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters epicRuntimeAbi
        }

        externalNativeBuild {
            cmake {
                arguments "-DPYTHON_PREFIX_DIR=${epicRuntimePrefix ?: ''}"
            }
        }
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/c/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDir(epicRuntimeGenerated.map { it.dir('assets') })
            jniLibs.srcDir(epicRuntimeGenerated.map { it.dir('jniLibs') })
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def props = new Properties()
            def localPropertiesFile = project.rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localPropertiesFile.withInputStream { props.load(it) }
            }

            def keyFile = props['keystore.file'] ? file(props['keystore.file']) : file("${rootDir}/keystore/release.jks")
            if (keyFile.exists()) {
                storeFile keyFile
                storePassword props['keystore.password'] ?: "android"
                keyAlias props['key.alias'] ?: "winlator_mali"
                keyPassword props['key.password'] ?: "android"
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            def releaseKeyFile = project.rootProject.file('keystore/release.jks')
            signingConfig releaseKeyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}


tasks.register('stageEpicPythonRuntime', Sync) {
    into(epicRuntimeGenerated)
    // The same build directory is used first for x86_64 instrumentation and
    // then for arm64-v8a production packaging; make ABI changes invalidate Sync.
    inputs.property('epicRuntimeAbi', epicRuntimeAbi)
    inputs.property('epicRuntimePrefix', epicRuntimePrefix ?: '')
    if (epicRuntimePrefix) {
        from("${epicRuntimePrefix}/lib/python3.15") {
            into 'assets/python/lib/python3.15'
            exclude '**/__pycache__/**'
            exclude '**/*.pyc'
        }
        from("${epicRuntimePrefix}/lib") {
            into "jniLibs/${epicRuntimeAbi}"
            include 'lib*.so*'
        }
        from('src/main/python') {
            into 'assets/python/lib/python3.15/site-packages'
        }
    }
    doLast {
        File pythonAssets = epicRuntimeGenerated.get().dir('assets').dir('python').asFile
        if (epicRuntimePrefix && pythonAssets.isDirectory()) {
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            List<File> files = []
            pythonAssets.eachFileRecurse { file -> if (file.isFile() && file.name != '.runtime-version') files.add(file) }
            files.sort { a, b ->
                pythonAssets.toPath().relativize(a.toPath()).toString() <=>
                    pythonAssets.toPath().relativize(b.toPath()).toString()
            }
            files.each { file ->
                String relative = pythonAssets.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
                digest.update(relative.getBytes('UTF-8'))
                file.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
            }
            String version = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            new File(pythonAssets, '.runtime-version').setText(version + '\n', 'UTF-8')
        }
    }
}

preBuild.dependsOn(stageEpicPythonRuntime)

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
