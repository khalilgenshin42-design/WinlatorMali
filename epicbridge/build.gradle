import java.security.MessageDigest

plugins {
    alias(libs.plugins.android.application)
}

// Resolve the CI -P property from the root project explicitly. A missing prefix
// must never silently produce a stub-only companion APK.
def epicRuntimePrefix = rootProject.findProperty('epicRuntimePrefix') ?: project.findProperty('epicRuntimePrefix') ?: System.getenv('EPIC_RUNTIME_PREFIX')
def epicRuntimeAbi = project.findProperty('epicRuntimeAbi') ?: 'arm64-v8a'
def epicRuntimeGenerated = layout.buildDirectory.dir('generated/epicRuntime')

android {
    namespace 'com.maliwinlator.epicbridge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.maliwinlator.epicbridge'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters epicRuntimeAbi
        }

        externalNativeBuild {
            cmake {
                arguments "-DPYTHON_PREFIX_DIR=${epicRuntimePrefix ?: ''}"
            }
        }
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/c/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDir(epicRuntimeGenerated.map { it.dir('assets') })
            jniLibs.srcDir(epicRuntimeGenerated.map { it.dir('jniLibs') })
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def props = new Properties()
            def localPropertiesFile = project.rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localPropertiesFile.withInputStream { props.load(it) }
            }

            def keyFile = props['keystore.file'] ? file(props['keystore.file']) : file("${rootDir}/keystore/release.jks")
            if (keyFile.exists()) {
                storeFile keyFile
                storePassword props['keystore.password'] ?: "android"
                keyAlias props['key.alias'] ?: "winlator_mali"
                keyPassword props['key.password'] ?: "android"
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            def releaseKeyFile = project.rootProject.file('keystore/release.jks')
            signingConfig releaseKeyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}


tasks.register('stageEpicPythonRuntime', Sync) {
    // The explicit zipfile/_path source overlaps the stdlib tree by design.
    // Keep the first copy and allow the explicit source to fill missing entries.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doFirst {
        if (!epicRuntimePrefix) {
            throw new GradleException('Epic CPython prefix is required; refusing to package a stub-only companion APK')
        }
        File prefix = new File(epicRuntimePrefix)
        ['include/python3.15/Python.h', 'lib/libpython3.15.so', 'lib/python3.15/os.py', 'lib/python3.15/zipfile/__init__.py', 'lib/python3.15/zipfile/_path/__init__.py'].each { relative ->
            if (!new File(prefix, relative).isFile()) {
                throw new GradleException("Epic CPython prefix is incomplete: ${new File(prefix, relative)}")
            }
        }
        System.out.println("Staging Epic CPython runtime from ${prefix.absolutePath} for ABI ${epicRuntimeAbi}")
    }
    into(epicRuntimeGenerated)
    // The same build directory is used first for x86_64 instrumentation and
    // then for arm64-v8a production packaging; make ABI changes invalidate Sync.
    inputs.property('epicRuntimeAbi', epicRuntimeAbi)
    inputs.property('epicRuntimePrefix', epicRuntimePrefix ?: '')
    if (epicRuntimePrefix) {
        from("${epicRuntimePrefix}/lib/python3.15") {
            into 'assets/python/lib/python3.15'
            exclude '**/__pycache__/**'
            exclude '**/*.pyc'
        }
        // Gradle's directory traversal can omit the relocated CPython 3.15
        // zipfile helper directory on some filesystems. Stage it explicitly.
        from("${epicRuntimePrefix}/lib/python3.15/zipfile/_path") {
            into 'assets/python/lib/python3.15/zipfile/_path'
            exclude '**/__pycache__/**'
            exclude '**/*.pyc'
        }
        from("${epicRuntimePrefix}/lib") {
            into "jniLibs/${epicRuntimeAbi}"
            include 'lib*.so*'
        }
        from('src/main/python') {
            into 'assets/python/lib/python3.15/site-packages'
        }
    }
    doLast {
        File pythonAssets = epicRuntimeGenerated.get().dir('assets').dir('python').asFile
        if (!pythonAssets.isDirectory()) {
            throw new GradleException('Epic CPython runtime assets were not staged')
        }
        if (epicRuntimePrefix && pythonAssets.isDirectory()) {
            File zipfilePackage = new File(pythonAssets, 'lib/python3.15/zipfile/__init__.py')
            File zipfilePathPackage = new File(pythonAssets, 'lib/python3.15/zipfile/_path/__init__.py')
            if (!zipfilePackage.isFile() || !zipfilePathPackage.isFile()) {
                throw new GradleException('CPython 3.15 zipfile package is incomplete in staged Epic runtime assets')
            }
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            List<File> files = []
            pythonAssets.eachFileRecurse { file -> if (file.isFile() && file.name != 'runtime-version.txt') files.add(file) }
            files.sort { a, b ->
                pythonAssets.toPath().relativize(a.toPath()).toString() <=>
                    pythonAssets.toPath().relativize(b.toPath()).toString()
            }
            files.each { file ->
                String relative = pythonAssets.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
                digest.update(relative.getBytes('UTF-8'))
                file.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
            }
            String version = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            new File(pythonAssets, 'runtime-version.txt').setText(version + '\n', 'UTF-8')
        }
    }
}

preBuild.dependsOn(stageEpicPythonRuntime)

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
